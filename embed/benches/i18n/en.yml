col1:
  - name: "String · Key-Value"
    scene: "High-performance caching, counters, distributed locks & binary payloads"
    cmds:
      - "GET"
      - "SET"
      - "MGET"
      - "MSET"
      - "INCRBY"
      - "DECRBY"
      - "APPEND"
      - "STRLEN"
      - "GETDEL"
      - "GETRANGE"
      - "SETRANGE"

  - name: "Hash · Dictionary"
    scene: "Object models, user profiles & multi-field attribute storage"
    cmds:
      - "HGET"
      - "HSET"
      - "HMGET"
      - "HEXISTS"
      - "HLEN"
      - "HDEL"
      - "HGETALL"
      - "HKEYS"
      - "HVALS"
      - "HINCRBY"

  - name: "List · Double-Ended Queue"
    scene: "Message queuing, social feeds & FIFO/LIFO pipelines"
    cmds:
      - "LPUSH"
      - "RPUSH"
      - "LPOP"
      - "RPOP"
      - "LLEN"
      - "LRANGE"
      - "LINDEX"
      - "LSET"
      - "LREM"
      - "LTRIM"

  - name: "JSON · Document (RedisJSON)"
    scene: "Nested JSON docs, JSONPath querying & atomic field mutations"
    cmds:
      - "JSON.GET"
      - "JSON.SET"
      - "JSON.DEL"
      - "JSON.NUMINCRBY"
      - "JSON.ARRLEN"
      - "JSON.TYPE"

  - name: "Search & Vector (RediSearch)"
    scene: "HNSW vector similarity, KNN Top-K search & full-text tag filtering"
    cmds:
      - "VECTOR.KNN"
      - "FT.SEARCH"
      - "FT.TAG"

  - name: "SortedInt · Compressed Set (WeDb Native)"
    scene: "Unread message IDs, ordered order serials, inverted tags & integer sets"
    cmds:
      - cmd: "SI.ADD"
        desc: "Add int64 to compressed set"
        exclusive: true
      - cmd: "SI.REM"
        desc: "Remove int64 from set"
        exclusive: true
      - cmd: "SI.CARD"
        desc: "Count total integer elements"
        exclusive: true
      - cmd: "SI.EXISTS"
        desc: "O(1) fast existence check"
        exclusive: true
      - cmd: "SI.RANGE"
        desc: "Range scan & cursor iter"
        exclusive: true

  - name: "HyperLogLog · Cardinality"
    scene: "Billion-scale UV counting with fixed tiny memory footprint (12KB)"
    cmds:
      - "PFADD"
      - "PFCOUNT"
      - cmd: "PFMERGE"
        desc: "Merge multiple HLL sketches"
        exclusive: true

  - name: "Storage Engine & Batch (WeDb Native)"
    scene: "Multi-tenant namespace isolation & atomic batch transaction engine"
    cmds:
      - cmd: "NAMESPACE"
        desc: "Multi-tenant isolated namespace"
        exclusive: true
      - cmd: "BATCH_COMMIT"
        desc: "Atomic batch commit engine"
        exclusive: true

col2:
  - name: "Set · Unordered Collection"
    scene: "Unique tags, social relations & set algebra operations"
    cmds:
      - "SADD"
      - "SREM"
      - "SISMEMBER"
      - "SCARD"
      - "SMEMBERS"
      - "SPOP"
      - "SRANDMEMBER"

  - name: "ZSet · Sorted Set"
    scene: "Leaderboards, score-based ranking & delayed task scheduling"
    cmds:
      - "ZADD"
      - "ZSCORE"
      - "ZRANGE"
      - "ZCARD"
      - "ZCOUNT"
      - "ZINCRBY"
      - "ZRANK"
      - "ZREVRANGE"
      - "ZPOPMIN"
      - "ZREM"

  - name: "Bitmap · Bit Operations"
    scene: "User check-in, retention analysis & billion-scale bitflags"
    cmds:
      - "GETBIT"
      - "SETBIT"
      - "BITCOUNT"
      - "BITPOS"

  - name: "Stream · Event Log"
    scene: "Event streaming, pub-sub messaging & consumer group pipeline"
    cmds:
      - "XADD"
      - "XLEN"
      - "XRANGE"
      - "XREAD"
      - "XDEL"

  - name: "Bloom & Cuckoo (RedisBloom)"
    scene: "Cache penetration defense, deduplication & dynamic deletion"
    cmds:
      - "BF.ADD"
      - "BF.EXISTS"
      - "BF.INFO"
      - "CF.ADD"
      - "CF.EXISTS"
      - "CF.DEL"

  - name: "TimeSeries (RedisTimeSeries)"
    scene: "IoT sensor metrics, financial ticker feeds & window aggregation"
    cmds:
      - "TS.ADD"
      - "TS.GET"
      - "TS.RANGE"
      - "TS.INCRBY"

  - name: "Geo · Spatial (GIS)"
    scene: "Location-based services (LBS), geofencing & radius search"
    cmds:
      - "GEOADD"
      - "GEODIST"
      - "GEOPOS"
      - "GEOHASH"

  - name: "T-Digest · Quantile (RedisBloom)"
    scene: "P50/P90/P99 streaming percentiles & quantile estimation"
    cmds:
      - "TDIGEST.ADD"
      - "TDIGEST.QUANTILE"
      - "TDIGEST.BYRANK"
      - "TDIGEST.CDF"

  - name: "Key & TTL Management"
    scene: "Key lifecycle, safety eviction, TTL & expiration management"
    cmds:
      - "EXISTS"
      - "DEL"
      - "EXPIRE"
      - "TTL"
