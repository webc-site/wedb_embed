<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" fill="none" viewBox="0 0 1200 1200"><defs><linearGradient id="card_grad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="rgba(30, 41, 59, 0.6)"/><stop offset="100%" stop-color="rgba(15, 23, 42, 0.7)"/></linearGradient><linearGradient id="title_grad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="100%" stop-color="#818cf8"/></linearGradient><filter id="card_shadow" width="110%" height="115%" x="-5%" y="-5%"><feDropShadow dx="0" dy="4" flood-color="#000" flood-opacity=".25" stdDeviation="6"/></filter></defs><style>text{font-family:-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Roboto,&quot;Hiragino Sans GB&quot;,&quot;Microsoft YaHei&quot;,sans-serif}.algo-row:hover rect{opacity:.95}</style><text x="36" y="56" fill="url(#title_grad)" font-size="28" font-weight="800" letter-spacing=".5">fastalp 浮点压缩基准横向评测</text><text x="36" y="88" fill="#94a3b8" font-size="14.5">多算法同机实测：解压吞吐量、压缩比与物理时序场景全量对比</text><g transform="translate(710 30)"><rect width="454" height="70" fill="rgba(15, 23, 42, 0.75)" stroke="rgba(255, 255, 255, 0.08)" rx="10"/><text x="16" y="22" fill="#38bdf8" font-size="11" font-weight="bold">BENCHMARK ENVIRONMENT</text><text x="16" y="40" fill="#cbd5e1" font-size="11.5">CPU: Apple M2 Max (12 核心: 8 性能核 @ 3.68 GHz + 4 能效核 @ 2.42 GHz)</text><text x="16" y="58" fill="#94a3b8" font-size="11">工具链: Rust 1.98.0 / LLVM Clang 22.1.8 (-O3 -march=native) ｜ 系统: macOS Sequoia 26.5.1 (Darwin 25.5.0 arm64)</text></g><g transform="translate(24 150)"><rect width="270" height="108" fill="url(#card_grad)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1.5" filter="url(#card_shadow)" rx="14"/><text x="18" y="28" fill="#94a3b8" font-size="12.5" font-weight="600">单核解压吞吐峰值</text><text x="18" y="64" fill="#38bdf8" font-size="30" font-weight="800">77.0 GB/s</text><text x="18" y="88" fill="#64748b" font-size="11.5">较 C++ 原版提速 3.52x (同值序列 136 ns)</text></g><g transform="translate(318 150)"><rect width="270" height="108" fill="url(#card_grad)" stroke="rgba(52, 211, 153, 0.4)" stroke-width="1.5" filter="url(#card_shadow)" rx="14"/><text x="18" y="28" fill="#94a3b8" font-size="12.5" font-weight="600">连续时序压缩率 (Ramp)</text><text x="18" y="64" fill="#34d399" font-size="30" font-weight="800">431.2x</text><text x="18" y="88" fill="#64748b" font-size="11.5">较 Pcodec 提升 9.7x，较 C++ 原版提升 458x</text></g><g transform="translate(612 150)"><rect width="270" height="108" fill="url(#card_grad)" stroke="rgba(129, 140, 248, 0.4)" stroke-width="1.5" filter="url(#card_shadow)" rx="14"/><text x="18" y="28" fill="#94a3b8" font-size="12.5" font-weight="600">31 数据集解压均值</text><text x="18" y="64" fill="#818cf8" font-size="30" font-weight="800">18.0 GB/s</text><text x="18" y="88" fill="#64748b" font-size="11.5">较 Pcodec 提速 9.0x，较 Zstd 提速 12.6x</text></g><g transform="translate(906 150)"><rect width="270" height="108" fill="url(#card_grad)" stroke="rgba(244, 114, 182, 0.4)" stroke-width="1.5" filter="url(#card_shadow)" rx="14"/><text x="18" y="28" fill="#94a3b8" font-size="12.5" font-weight="600">31 数据集总压缩体积</text><text x="18" y="64" fill="#f472b6" font-size="30" font-weight="800">97.9 KB</text><text x="18" y="88" fill="#64748b" font-size="11.5">较 C++ 原版节省 4.79% 空间，零负压缩膨胀</text></g><text x="36" y="282" fill="#f8fafc" font-size="17" font-weight="bold">ALP 论文 31 个真实公开数据集全量综合对比 (253,952 字节)</text><text x="36" y="304" fill="#94a3b8" font-size="12.5">衡量各算法面对广泛真实物理、金融、气象、医疗等浮点数据的综合处理能力</text><g transform="translate(880 284)"><rect width="12" height="12" fill="#38bdf8" rx="3"/><text x="18" y="10" fill="#cbd5e1" font-size="11.5">解压吞吐 (GB/s)</text><rect width="12" height="12" x="130" fill="#0284c7" opacity=".85" rx="3"/><text x="148" y="10" fill="#94a3b8" font-size="11.5">编码吞吐 (GB/s)</text></g><text x="44" y="334" fill="#64748b" font-size="12" font-weight="bold">算法名称</text><text x="265" y="334" fill="#64748b" font-size="12" font-weight="bold">解码吞吐 &amp; 编码吞吐</text><text x="730" y="334" fill="#64748b" font-size="12" font-weight="bold">压缩比</text><text x="910" y="334" fill="#64748b" font-size="12" font-weight="bold">31集总体积</text><text x="1060" y="334" fill="#64748b" font-size="12" font-weight="bold">STATUS</text><path stroke="rgba(255, 255, 255, 0.08)" d="M24 342h1152"/><g class="algo-row"><rect width="1152" height="56" x="24" y="348" fill="rgba(14, 165, 233, 0.08)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1.2" rx="10"/><text x="44" y="374" fill="#38bdf8" font-size="14.5" font-weight="bold">fastalp (Rust)</text><text x="44" y="392" fill="#64748b" font-size="11.5">专用浮点时序</text><rect width="58" height="18" x="186" y="358" fill="#0284c7" rx="4"/><text x="215" y="371" fill="#fff" font-size="10.5" font-weight="bold" text-anchor="middle">LEADER</text><g transform="translate(265 354)"><rect width="280" height="14" fill="rgba(15, 23, 42, 0.5)" rx="3"/><rect width="53.3" height="14" fill="#38bdf8" rx="3"/><text x="290" y="12" fill="#38bdf8" font-size="12" font-weight="bold">5.33 GB/s</text></g><g transform="translate(265 376)"><rect width="280" height="12" fill="rgba(15, 23, 42, 0.4)" rx="3"/><rect width="6" height="12" fill="#0284c7" opacity=".85" rx="3"/><text x="290" y="10" fill="#94a3b8" font-size="11">0.16 GB/s</text></g><text x="730" y="374" fill="#38bdf8" font-size="14.5" font-weight="bold">2.59x</text><text x="730" y="392" fill="#94a3b8" font-size="12">24.7 b/v</text><text x="910" y="376" fill="#e2e8f0" font-size="14" font-weight="500">95.6 KB</text><text x="910" y="392" fill="#64748b" font-size="11">97,943 B</text><text x="1060" y="380" fill="#34d399" font-size="12.5" font-weight="bold">
